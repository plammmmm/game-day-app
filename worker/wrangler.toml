name = "gameday-worker"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
ALLOWED_ORIGIN = "https://plammmmm.github.io"
CACHE_SECONDS = "600"
MONTHLY_CREDITS = "500"
BUDGET_STOP_PCT = "80"

# Run `npx wrangler kv namespace create GAMEDAY_KV` and paste the id here.
[[kv_namespaces]]
binding = "GAMEDAY_KV"
id = "REPLACE_WITH_KV_ID"

# Daily opening-line snapshot: 14:00 UTC = 8am CT (standard time).
# Enabled in v1.1. Handler is a no-op in Phase 0.
[triggers]
crons = ["0 14 * * *"]

# Secret (never in this file): npx wrangler secret put ODDS_API_KEY
